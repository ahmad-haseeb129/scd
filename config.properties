# Hadith Database settings. The application reads this file from its working directory (the project root).

# DAO factory chosen at start-up (Abstract Factory). A new data source needs a new factory class, nothing else.
dal.factory=hadithdb.dal.MySQLDAOFactory

# MySQL / MariaDB connection. The values below are the XAMPP defaults for a local development machine:
# user root with an empty password. Change them to match your own server.
db.server=jdbc:mysql://localhost:3306/
db.name=hadith_db
db.options=useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
db.user=root
db.password=
